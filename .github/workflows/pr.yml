name: LogicSugar PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
  workflow_dispatch:

concurrency:
  group: logic-sugar-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out LogicSugar
        uses: actions/checkout@v7
        with:
          path: LogicSugar

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Check out Mindustry v160.1
        uses: actions/checkout@v7
        with:
          repository: Anuken/Mindustry
          ref: 84cdf2bbfeeee981ff9922f5872b16433591da7b
          path: Mindustry-master
          fetch-depth: 1

      - name: Check out the matching Arc revision
        uses: actions/checkout@v7
        with:
          repository: Anuken/Arc
          ref: 5a9696f1d41ea32455568876e1f6b553f99dd8b5
          path: Arc
          fetch-depth: 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Add Android build tools to PATH
        run: echo "${ANDROID_HOME}/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Build Mindustry desktop dependency
        working-directory: Mindustry-master
        run: ./gradlew --no-daemon desktop:dist

      - name: Verify Mindustry dependency JAR
        run: test -s Mindustry-master/desktop/build/libs/Mindustry.jar

      - name: Compile and run LogicSugar checks
        working-directory: LogicSugar
        run: bash ./gradlew --no-daemon check build --stacktrace --console=plain

      - name: Prepare artifact
        working-directory: LogicSugar
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle)"
          test -n "$version"
          mkdir -p artifact
          python3 - "$version" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          version = sys.argv[1]
          jar = Path(f"build/libs/LogicSugar-v{version}.jar")
          if not jar.is_file():
              raise SystemExit(f"Missing built JAR: {jar}")

          with zipfile.ZipFile(jar) as archive:
              if "classes.dex" not in archive.namelist():
                  raise SystemExit("Built JAR is missing classes.dex")
              metadata = archive.read("mod.json").decode("utf-8")
              if f'"version": "{version}"' not in metadata:
                  raise SystemExit("Embedded mod.json version does not match build.gradle")

          Path("artifact/LogicSugar.jar").write_bytes(jar.read_bytes())
          PY

      - name: Upload LogicSugar.jar
        uses: actions/upload-artifact@v4
        with:
          name: LogicSugar-${{ github.sha }}
          path: LogicSugar/artifact/LogicSugar.jar
          if-no-files-found: error

  release:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out LogicSugar
        uses: actions/checkout@v7
        with:
          path: LogicSugar
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Check out Mindustry v160.1
        uses: actions/checkout@v7
        with:
          repository: Anuken/Mindustry
          ref: 84cdf2bbfeeee981ff9922f5872b16433591da7b
          path: Mindustry-master
          fetch-depth: 1

      - name: Check out the matching Arc revision
        uses: actions/checkout@v7
        with:
          repository: Anuken/Arc
          ref: 5a9696f1d41ea32455568876e1f6b553f99dd8b5
          path: Arc
          fetch-depth: 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Add Android build tools to PATH
        run: echo "${ANDROID_HOME}/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Build Mindustry desktop dependency
        working-directory: Mindustry-master
        run: ./gradlew --no-daemon desktop:dist

      - name: Verify Mindustry dependency JAR
        run: test -s Mindustry-master/desktop/build/libs/Mindustry.jar

      - name: Prepare next release version
        id: version
        working-directory: LogicSugar
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          gradle_path = Path("build.gradle")
          mod_path = Path("mod.json")
          gradle = gradle_path.read_text()
          mod = mod_path.read_text()
          gradle_version = re.compile(r'(?m)^version = "(\d+)\.(\d+)\.(\d+)"$')
          mod_version = re.compile(r'(?m)^(\s*"version":\s*")(\d+)\.(\d+)\.(\d+)(")')
          gradle_match = gradle_version.search(gradle)
          mod_match = mod_version.search(mod)
          if gradle_match is None or mod_match is None:
              raise SystemExit("Expected numeric major.minor.patch versions in build.gradle and mod.json")

          current = ".".join(gradle_match.groups())
          if current != ".".join(mod_match.groups()[1:4]):
              raise SystemExit("build.gradle and mod.json versions do not match")

          release_subject = f"chore(release): v{current} [skip ci]"
          release_commit = subprocess.run(
              ["git", "log", "--format=%s", "--all"],
              check=True, capture_output=True, text=True
          ).stdout.splitlines()
          release_exists = subprocess.run(
              ["gh", "release", "view", f"v{current}"],
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
          ).returncode == 0
          pending = release_subject in release_commit and (
              not release_exists or os.environ["EVENT_NAME"] == "workflow_dispatch"
          )

          if pending:
              version = current
              print(f"Retrying pending release v{version}")
          else:
              major, minor, patch = map(int, current.split("."))
              version = f"{major}.{minor}.{patch + 1}"
              gradle = gradle_version.sub(
                  f'version = "{version}"', gradle, count=1
              )
              mod = mod_version.sub(
                  lambda match: f'{match.group(1)}{version}{match.group(5)}', mod, count=1
              )
              gradle_path.write_text(gradle)
              mod_path.write_text(mod)
              print(f"Bumping release version {current} -> {version}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag=v{version}\n")
              output.write(f"pending={'true' if pending else 'false'}\n")
          PY

      - name: Build and verify release package
        working-directory: LogicSugar
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash ./gradlew --no-daemon build --stacktrace --console=plain
          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          jar = Path(f"build/libs/LogicSugar-v{version}.jar")
          if not jar.is_file():
              raise SystemExit(f"Missing release JAR: {jar}")

          with zipfile.ZipFile(jar) as archive:
              if "classes.dex" not in archive.namelist():
                  raise SystemExit("Release JAR is missing classes.dex")
              metadata = archive.read("mod.json").decode("utf-8")
              if f'"version": "{version}"' not in metadata:
                  raise SystemExit("Embedded mod.json version does not match release version")

          Path("LogicSugar.jar").write_bytes(jar.read_bytes())
          PY

      - name: Upload versioned release candidate
        uses: actions/upload-artifact@v4
        with:
          name: LogicSugar-${{ steps.version.outputs.tag }}
          path: LogicSugar/LogicSugar.jar
          if-no-files-found: error

      - name: Commit version bump
        if: steps.version.outputs.pending != 'true'
        working-directory: LogicSugar
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.gradle mod.json
          git commit -m "chore(release): v${RELEASE_VERSION} [skip ci]"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            push origin HEAD:main

      - name: Create or update GitHub Release
        working-directory: LogicSugar
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" LogicSugar.jar --clobber
          else
            gh release create "$RELEASE_TAG" LogicSugar.jar \
              --title "LogicSugar ${RELEASE_TAG#v}" \
              --generate-notes \
              --target main
          fi
